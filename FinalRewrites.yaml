name: 株式会社 Final 重定向
description: "株式会社 Final 重定向规则"

url_rewrites:
  - match: ^https?://(www\.)?final\.com
    location: https://final-inc.com
    status_code: 302
  - match: ^https?://(www\.)?final\.com(.*)
    location: https://final-inc.com$2
    status_code: 302


mitm:
  hostnames:
    - final.com
    - www.final.com
    - final-inc.com
