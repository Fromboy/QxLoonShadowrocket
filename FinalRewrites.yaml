name: 株式会社 final 重定向
description: "株式会社 final 重定向规则"

# Egern 使用重定向规则通常放在 rewrites 或 url_rewrite 模块中，具体根据其重定向语法编写

rewrites:
  - match: ^https?://(www\.)?final\.com
    target: https://final-inc.com
    type: 302
  - match: ^https?://(www\.)?final\.com(.*)
    target: https://final-inc.com$2
    type: 302

mitm:
  hostnames:
    - final.com
    - www.final.com
    - final-inc.com
