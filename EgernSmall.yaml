# 官方文档：https://doc.egernapp.com
# 最后更新时间: 2025-09-11
# Egern Version ≥ v2.0.0(552)
# Egern 简洁配置，只有国内🇨🇳和代理🌍 
# 分流库 = https://github.com/Repcz/Tool/tree/X/Egern/Rules
# 在手动策略《〈 添加URL哪里填写自己的订阅 〉》哪里✍️自己的机场订阅地址开始愉快的冲浪吧
# Egern url = https://raw.githubusercontent.com/Fromboy/QxLoonShadowrocket/refs/heads/Egern/Egern.yaml
# Egernsmall url = https://raw.githubusercontent.com/Fromboy/QxLoonShadowrocket/refs/heads/Egern/EgernSmall.yaml
# Egern Lite url = https://raw.githubusercontent.com/Fromboy/QxLoonShadowrocket/refs/heads/Egern/EgernLite.yaml
# Egern- Auto url = https://raw.githubusercontent.com/Fromboy/QxLoonShadowrocket/refs/heads/Egern/Egern-Auto.yaml
# ================================
ipv6: false
http_port: 3080
socks_port: 3090
allow_external_connections: true
vif_only: true
close_connections_on_policy_change: false
hijack_dns:
- '*:53'
geoip_db_url: https://github.com/xream/geoip/releases/latest/download/ipinfo.country.mmdb
asn_db_url: https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://1.1.1.1/generate_204
direct_latency_test_url: http://connectivitycheck.platform.hicloud.com/generate_204
compat_route: false
dns:
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  - 1.12.12.12
  - 120.53.53.53
  - 2400:3200::1
  upstreams:
    AdBlack:
    - quic://dns.adguard-dns.com
    - https://dns.adguard-dns.com/dns-query
    Alibaba:
    - 223.5.5.5
    - https://dns.alidns.com/dns-query
    Tencent:
    - 119.29.29.29
    - https://doh.pub/dns-query
    ByteDance:
    - 180.184.2.2
    - 180.184.1.1
    China:
    - 223.5.5.5
    - 119.29.29.29
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    Global:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    ProxyDNS:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    
  forward:
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/reject.txt
      value: AdBlack
      update_interval: 86400
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaMax/ChinaMax.list
      value: China
      update_interval: 86400
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Apple/Apple.list
      value: China
      update_interval: 86400
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/DouYin/DouYin.list
      value: ByteDance
      update_interval: 86400
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Tencent/Tencent.list
      value: Tencent
      update_interval: 86400
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Alibaba/Alibaba.list
      value: Alibaba
      update_interval: 86400
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Global/Global.list
      value: Global
      update_interval: 86400
      disabled: false
  - domain_wildcard:
      match: '*.cn'
      value: China
      disabled: false
  - domain_wildcard:
      match: '*'
      value: ProxyDNS
      disabled: false
  public_ip_lookup_url: https://ifconfig.me/ip
policy_groups:
- auto_test:
    name: 最优选择
    policies: []
    flatten: true
    filter: ^(?!.*(?:邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|到期|过期|已用|联系|邮箱|工单|群|贩卖|通知|倒卖|防止|公益|提示)).*$
    urls:
    - 远程订阅
    interval: 60
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
    hidden: false
- select:
    name: 环游世界
    policies:
    - 香港节点
    - 台湾节点
    - 狮城节点
    - 日本节点
    - 美国节点
    flatten: false
    icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/quanqiu(3).png
    hidden: false
- auto_test:
    name: 香港节点
    policies:
    - 最优选择
    flatten: true
    filter: 🇭🇰|港|香港|Hong\s*Kong|HongKong
    icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/flag/HK_01.png
    hidden: false
- auto_test:
    name: 台湾节点
    policies:
    - 最优选择
    flatten: true
    filter: 🇹🇼|TW|台湾|中华台北|Taiwan|TWN
    icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/flag/TW_01.png
    hidden: false
    
- auto_test:
    name: 日本节点
    policies:
    - 最优选择
    flatten: true
    filter: 🇯🇵|日本|Japan|JP|JPN
    icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/flag/JP_01.png
    hidden: false
- auto_test:
    name: 狮城节点
    policies:
    - 最优选择
    flatten: true
    filter: 🇸🇬|SG|新加坡|狮城|Singapore|SGP
    icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/flag/SG_01.png
    hidden: false
- auto_test:
    name: 美国节点
    policies:
    - 最优选择
    flatten: true
    filter: 🇺🇸|US|美国|美利坚|United States|USA
    icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/flag/US_01.png
    hidden: false

    
rules:
- rule_set:
    match: https://raw.githubusercontent.com/GMOogway/shadowrocket-rules/master/sr_reject_list.module
    policy: REJECT-DROP
    disabled: false
- rule_set:
    name: 拒绝IOS更新
    match: https://raw.githubusercontent.com/Fromboy/QxLoonShadowrocket/refs/heads/Egern/EgernSoftwareUpdates.yaml
    policy: REJECT
    update_interval: 86400
    disabled: false
- rule_set:
    match: https://raw.githubusercontent.com/GMOogway/shadowrocket-rules/master/sr_direct_list.module
    policy: DIRECT
    disabled: false
- rule_set:
    match: https://raw.githubusercontent.com/GMOogway/shadowrocket-rules/master/sr_proxy_list.module
    policy: 环游世界
    disabled: false
- domain_suffix:
    match: appstorrent.ru
    policy: DIRECT
    disabled: false
- rule_set:
    match: https://raw.githubusercontent.com/VirgilClyne/GetSomeFries/main/ruleset/ASN.China.list
    policy: DIRECT
    disabled: false
- rule_set:
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaMax/ChinaMax.list
    policy: DIRECT
    disabled: false
- url_regex:
    match: (Subject|HELO|SMTP)
    policy: DIRECT
    disabled: false
- domain_suffix:
    match: smtp
    policy: DIRECT
    disabled: false
- rule_set:
    match: https://raw.githubusercontent.com/Fromboy/QxLoonShadowrocket/refs/heads/Egern/EgernLAN.yaml
    policy: DIRECT
    disabled: false
- domain_suffix:
    match: cn
    policy: DIRECT
    disabled: false
- geoip:
    match: CN
    policy: DIRECT
    no_resolve: false
    disabled: false
- default:
    policy: 环游世界
scriptings:
- generic:
    name: 老黄历小组件
    script_url: https://raw.githubusercontent.com/xcgtb/Egern-Widgets/main/HL.js
mitm:
  ca_passphrase: egern
widgets:
- name: 老黄历
  script_name: 老黄历小组件
modules:
- url: https://raw.githubusercontent.com/Fromboy/QxLoonShadowrocket/refs/heads/Egern/crushcloud-dns.yaml
  enabled: true
- url: https://raw.githubusercontent.com/Fromboy/QxLoonShadowrocket/refs/heads/Egern/FinalRewrites.yaml
  enabled: true
- url: https://github.com/NSRingo/MapKit/releases/latest/download/iRingo.Maps.yaml
  enabled: true
default_subscription_group: 最优选择

